version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Parches del SDK de Expo juntos: los módulos expo-* de un mismo SDK se
      # publican coordinados y deben ir a la par.
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*', 'jest-expo']
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Un salto de versión mayor de expo-* ES una migración de SDK completa
      # (se hace a mano con `npx expo install expo@^N --fix` + build y prueba
      # en dispositivo), nunca paquete a paquete: mezclar módulos de SDK 58 con
      # un SDK 57 duplica expo-constants y rompe la app (PRs #31/#33/#39/#40).
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      # React Native, sus paquetes y react/react-dom los fija el SDK de Expo:
      # se actualizan solo junto con la migración de SDK (PR #34).
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # eslint 10 rompe eslint-plugin-react (y con él el hook de pre-commit,
      # PR #41) hasta que el plugin lo soporte.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      github-actions:
        patterns: ['*']
