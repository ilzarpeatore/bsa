version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Todo lo que fija el SDK de Expo NO se actualiza con Dependabot, sino con
      # `npx expo install --check` / `npx expo install <paquete>`, que elige la
      # versión exacta validada para el SDK instalado. Dependabot propone "la
      # última", que puede no ser la del SDK (PR #46 mezclaba expo-*,
      # react-native y react). Un salto mayor de expo es una migración de SDK
      # completa (`npx expo install expo@^N --fix` + build y prueba en
      # dispositivo): mezclar módulos de SDK 58 con un SDK 57 rompe la app
      # (PRs #31/#33/#39/#40).
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'react-native'
      - dependency-name: '@react-native/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      # Módulos nativos: una versión mayor cambia código nativo y tiene que ser
      # compatible con la versión de React Native del SDK (PRs #51/#52/#53).
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-native-*/*'
        update-types: ['version-update:semver-major']
      # Herramientas que Expo 57 todavía no soporta en su versión mayor nueva:
      # eslint 10 rompe eslint-plugin-react y el hook de pre-commit (PR #41),
      # TypeScript 7 no lo soporta typescript-eslint (PR #50), Babel 8 y jest 30
      # no son los que usan babel-preset-expo / jest-expo 57 (PRs #47/#48).
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      # tailwind-variants: @gluestack-ui/utils fija 0.1.20 para tva(); un salto
      # mayor en la app no lo usaría gluestack y rompería la coherencia de
      # estilos (PR #49). nativewind 5 sigue en pre-release: se actualiza a mano
      # junto con gluestack (PR #54).
      - dependency-name: 'tailwind-variants'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nativewind'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      github-actions:
        patterns: ['*']
